name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: lmscript compiler (npm @lmctl-ai/lmctl)
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.347
          lmscript --version || true

      - name: build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -v ./...

      - name: unit tests and conformance vectors
        run: go test -v ./...

      - name: standalone conformance runner
        run: |
          go run ./cmd/conformance ./conformance/vectors
          go run ./cmd/conformance ./conformance/stdlib-vectors

      - name: example greeter host
        run: bash examples/greeter/test.sh
